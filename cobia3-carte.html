<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suivi COBIA 3 — En direct</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0a1628;
    --navy-mid: #112240;
    --navy-light: #1a3a6e;
    --accent: #00d4ff;
    --accent2: #00ff88;
    --warn: #ffb347;
    --text: #e8f4fd;
    --text-dim: #7a9bb5;
    --panel-bg: rgba(10,22,40,0.92);
    --border: rgba(0,212,255,0.2);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background: var(--navy); font-family: 'Inter', sans-serif; color: var(--text); overflow: hidden; height: 100vh; }

  #map { position: absolute; inset: 0; z-index: 1; }

  /* HEADER */
  .header {
    position: absolute; top: 0; left: 0; right: 0; z-index: 1000;
    background: linear-gradient(180deg, rgba(10,22,40,0.97) 0%, rgba(10,22,40,0.0) 100%);
    padding: 14px 20px 40px;
    display: flex; align-items: center; gap: 14px;
  }
  .header-logo {
    width: 42px; height: 42px;
    background: var(--accent);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 20px rgba(0,212,255,0.5);
    flex-shrink: 0;
  }
  .header-logo svg { width: 24px; height: 24px; fill: var(--navy); }
  .header-title { font-family: 'Rajdhani', sans-serif; }
  .header-title h1 { font-size: 22px; font-weight: 700; letter-spacing: 2px; color: var(--text); line-height: 1; }
  .header-title p { font-size: 11px; color: var(--text-dim); letter-spacing: 1px; text-transform: uppercase; margin-top: 2px; }
  .header-live {
    margin-left: auto;
    display: flex; align-items: center; gap: 7px;
    background: rgba(0,255,136,0.1);
    border: 1px solid rgba(0,255,136,0.3);
    border-radius: 20px;
    padding: 5px 12px;
    font-size: 11px; font-weight: 500; color: var(--accent2);
    letter-spacing: 1px; text-transform: uppercase;
  }
  .live-dot {
    width: 7px; height: 7px;
    background: var(--accent2);
    border-radius: 50%;
    animation: pulse 1.5s infinite;
  }
  @keyframes pulse {
    0%,100% { opacity:1; transform:scale(1); }
    50% { opacity:0.4; transform:scale(0.8); }
  }

  /* PANEL INFO */
  .info-panel {
    position: absolute; bottom: 20px; left: 16px;
    z-index: 1000;
    background: var(--panel-bg);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 18px;
    width: 260px;
    backdrop-filter: blur(12px);
    box-shadow: 0 8px 40px rgba(0,0,0,0.5), 0 0 0 1px rgba(0,212,255,0.05);
  }
  .panel-section { margin-bottom: 14px; }
  .panel-section:last-child { margin-bottom: 0; }
  .section-label {
    font-size: 9px; letter-spacing: 2px; text-transform: uppercase;
    color: var(--text-dim); font-weight: 500;
    margin-bottom: 8px;
    display: flex; align-items: center; gap: 6px;
  }
  .section-label::after { content:''; flex:1; height:1px; background: var(--border); }

  .nav-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .nav-item { background: rgba(255,255,255,0.03); border-radius: 8px; padding: 8px 10px; }
  .nav-item .label { font-size: 9px; color: var(--text-dim); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 3px; }
  .nav-item .value { font-family: 'Rajdhani', sans-serif; font-size: 19px; font-weight: 600; color: var(--text); line-height: 1; }
  .nav-item .unit { font-size: 10px; color: var(--text-dim); }
  .nav-item.accent .value { color: var(--accent); }

  /* MÉTÉO */
  .meteo-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .meteo-item { background: rgba(255,255,255,0.03); border-radius: 8px; padding: 8px 10px; display:flex; gap:8px; align-items:center; }
  .meteo-icon { font-size: 20px; flex-shrink:0; }
  .meteo-item .label { font-size: 9px; color: var(--text-dim); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 2px; }
  .meteo-item .value { font-family: 'Rajdhani', sans-serif; font-size: 16px; font-weight: 600; color: var(--warn); line-height: 1.1; }
  .meteo-item .unit { font-size: 9px; color: var(--text-dim); }

  .timestamp {
    font-size: 10px; color: var(--text-dim);
    text-align: center;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--border);
  }

  /* OFFLINE */
  .offline-badge {
    display: none;
    position: absolute; top: 70px; left: 50%; transform: translateX(-50%);
    z-index: 1001;
    background: rgba(255,80,80,0.15);
    border: 1px solid rgba(255,80,80,0.4);
    color: #ff8080;
    padding: 6px 16px; border-radius: 20px;
    font-size: 11px; letter-spacing: 1px;
  }

  /* Leaflet overrides */
  .leaflet-control-zoom { border: 1px solid var(--border) !important; background: var(--panel-bg) !important; }
  .leaflet-control-zoom a { color: var(--accent) !important; background: transparent !important; border-color: var(--border) !important; }
  .leaflet-control-attribution { background: rgba(10,22,40,0.7) !important; color: var(--text-dim) !important; font-size: 9px !important; }
  .leaflet-control-attribution a { color: var(--text-dim) !important; }

  @media (max-width:480px) {
    .info-panel { width: calc(100vw - 32px); bottom: 16px; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-logo">
    <svg viewBox="0 0 24 24"><path d="M3 13.5l1.5-9 4 3 3.5-6 3.5 6 4-3 1.5 9H3zm0 2h18l-1 3H4l-1-3z"/></svg>
  </div>
  <div class="header-title">
    <h1>COBIA 3</h1>
    <p>Suivi en temps réel — Polynésie française</p>
  </div>
  <div class="header-live">
    <div class="live-dot"></div>
    En direct
  </div>
</div>

<div class="offline-badge" id="offlineBadge">⚠ Signal perdu</div>

<div id="map"></div>

<div class="info-panel">
  <!-- Navigation -->
  <div class="panel-section">
    <div class="section-label">Navigation</div>
    <div class="nav-grid">
      <div class="nav-item accent">
        <div class="label">Vitesse</div>
        <div class="value" id="sog">--</div>
        <div class="unit">nœuds</div>
      </div>
      <div class="nav-item">
        <div class="label">Cap</div>
        <div class="value" id="cog">--</div>
        <div class="unit">degrés</div>
      </div>
      <div class="nav-item">
        <div class="label">Latitude</div>
        <div class="value" id="lat" style="font-size:14px">--</div>
        <div class="unit">°S</div>
      </div>
      <div class="nav-item">
        <div class="label">Longitude</div>
        <div class="value" id="lon" style="font-size:14px">--</div>
        <div class="unit">°W</div>
      </div>
    </div>
  </div>

  <!-- Météo marine -->
  <div class="panel-section">
    <div class="section-label">Météo marine</div>
    <div class="meteo-grid">
      <div class="meteo-item">
        <div class="meteo-icon">🌬️</div>
        <div>
          <div class="label">Vent</div>
          <div class="value" id="windSpeed">--</div>
          <div class="unit" id="windDir">--</div>
        </div>
      </div>
      <div class="meteo-item">
        <div class="meteo-icon">🌊</div>
        <div>
          <div class="label">Houle</div>
          <div class="value" id="waveHeight">--</div>
          <div class="unit" id="wavePeriod">--</div>
        </div>
      </div>
    </div>
  </div>

  <div class="timestamp" id="updated">Connexion en cours…</div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// ── CONFIG ─────────────────────────────────────────────────────────────
const SUPABASE_URL = 'https://ybuorfcysswkyrcytqee.supabase.co/rest/v1/positions?order=created_at.desc&limit=1';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlidW9yZmN5c3N3a3lyY3l0cWVlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDY5OTgxOTUsImV4cCI6MjA2MjU3NDE5NX0.bI8QVYH0pOUHF8R-VxG0V6YmkfXz-gJLDT7pf30Q3Z8';
const TRAIL_URL    = 'https://ybuorfcysswkyrcytqee.supabase.co/rest/v1/positions?order=created_at.asc&limit=120';
const REFRESH_POS  = 30000;   // 30s
const REFRESH_MTO  = 3600000; // 1h

// Directions en français
const DIRS = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSO','SO','OSO','O','ONO','NO','NNO'];
function degToDir(d) { return DIRS[Math.round(d/22.5)%16]; }

// ── CARTE ──────────────────────────────────────────────────────────────
const map = L.map('map', { zoomControl: true, attributionControl: true }).setView([-17, -149], 7);

L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
  attribution: 'Imagery © Esri',
  maxZoom: 17
}).addTo(map);

L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_only_labels/{z}/{x}/{y}{r}.png', {
  attribution: '© CartoDB',
  subdomains: 'abcd', maxZoom: 17, opacity: 0.8
}).addTo(map);

// ── ICÔNE NAVIRE ───────────────────────────────────────────────────────
function makeShipIcon(cogDeg) {
  const rad = (cogDeg - 90) * Math.PI / 180;
  const pts = [
    [0, -13], [7, 8], [0, 4], [-7, 8]
  ].map(([x, y]) => {
    const rx = x * Math.cos(rad) - y * Math.sin(rad);
    const ry = x * Math.sin(rad) + y * Math.cos(rad);
    return `${rx + 16},${ry + 16}`;
  }).join(' ');

  return L.divIcon({
    html: `<svg width="32" height="32" viewBox="0 0 32 32">
      <polygon points="${pts}" fill="#00d4ff" stroke="#0a1628" stroke-width="1.5" opacity="0.95"/>
    </svg>`,
    className: '',
    iconSize: [32, 32],
    iconAnchor: [16, 16]
  });
}

let shipMarker = null;
let trailLine  = L.polyline([], { color: 'rgba(0,212,255,0.35)', weight: 2, dashArray: '5,5' }).addTo(map);

// ── POSITION ───────────────────────────────────────────────────────────
let lastLat = null, lastLon = null;

async function fetchPosition() {
  try {
    const res = await fetch(SUPABASE_URL, {
      headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` }
    });
    const data = await res.json();
    if (!data || !data.length) return;

    const pos = data[0];
    const lat  = parseFloat(pos.lat);
    const lon  = parseFloat(pos.lon);
    const cog  = pos.cog || 0;
    const sogMs = pos.sog || 0;
    const sogKn = (sogMs / 1.852).toFixed(1);

    // Marker
    const icon = makeShipIcon(cog);
    if (!shipMarker) {
      shipMarker = L.marker([lat, lon], { icon, zIndexOffset: 1000 }).addTo(map);
      map.setView([lat, lon], 9);
    } else {
      shipMarker.setLatLng([lat, lon]);
      shipMarker.setIcon(icon);
    }

    // UI nav
    document.getElementById('lat').textContent  = Math.abs(lat).toFixed(4);
    document.getElementById('lon').textContent  = Math.abs(lon).toFixed(4);
    document.getElementById('sog').textContent  = sogKn;
    document.getElementById('cog').textContent  = Math.round(cog);

    const d = new Date(pos.ts || pos.created_at);
    const ago = Math.round((Date.now() - d.getTime()) / 60000);
    document.getElementById('updated').textContent =
      `Mis à jour il y a ${ago < 2 ? 'moins d\'1 min' : ago + ' min'}`;

    document.getElementById('offlineBadge').style.display = ago > 10 ? 'block' : 'none';

    // Météo si position changée significativement
    if (lastLat === null || Math.abs(lat - lastLat) > 0.1 || Math.abs(lon - lastLon) > 0.1) {
      fetchMeteo(lat, lon);
    }
    lastLat = lat; lastLon = lon;

  } catch(e) {
    console.error('Position error:', e);
    document.getElementById('offlineBadge').style.display = 'block';
  }
}

// ── TRACE ──────────────────────────────────────────────────────────────
async function fetchTrail() {
  try {
    const res = await fetch(TRAIL_URL, {
      headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` }
    });
    const data = await res.json();
    if (data && data.length > 1) {
      trailLine.setLatLngs(data.map(p => [parseFloat(p.lat), parseFloat(p.lon)]));
    }
  } catch(e) {}
}

// ── MÉTÉO MARINE (OpenMeteo) ───────────────────────────────────────────
async function fetchMeteo(lat, lon) {
  try {
    const url = `https://marine-api.open-meteo.com/v1/marine?latitude=${lat}&longitude=${lon}`
      + `&hourly=wave_height,wave_period,wave_direction,wind_wave_height`
      + `&wind_speed_unit=kn&forecast_days=1&timezone=auto`;

    // Météo vent depuis l'API standard
    const urlWind = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}`
      + `&hourly=wind_speed_10m,wind_direction_10m&wind_speed_unit=kn&forecast_days=1&timezone=auto`;

    const [resMarine, resWind] = await Promise.all([
      fetch(url),
      fetch(urlWind)
    ]);

    const marine = await resMarine.json();
    const wind   = await resWind.json();

    // Heure courante arrondie
    const nowH = new Date();
    nowH.setMinutes(0,0,0);
    const isoH = nowH.toISOString().slice(0,13);
    const idx = marine.hourly.time.findIndex(t => t.startsWith(isoH));
    const i = idx >= 0 ? idx : 0;

    // Houle
    const wh  = marine.hourly.wave_height?.[i];
    const wp  = marine.hourly.wave_period?.[i];
    if (wh != null) {
      document.getElementById('waveHeight').textContent = wh.toFixed(1) + ' m';
      document.getElementById('wavePeriod').textContent = wp ? `période ${Math.round(wp)}s` : '';
    }

    // Vent
    const idxW = wind.hourly.time.findIndex(t => t.startsWith(isoH));
    const iW = idxW >= 0 ? idxW : 0;
    const ws = wind.hourly.wind_speed_10m?.[iW];
    const wd = wind.hourly.wind_direction_10m?.[iW];
    if (ws != null) {
      document.getElementById('windSpeed').textContent = Math.round(ws) + ' nd';
      document.getElementById('windDir').textContent   = wd != null ? `dir. ${degToDir(wd)}` : '';
    }

  } catch(e) {
    console.warn('Météo indisponible:', e);
    document.getElementById('windSpeed').textContent  = '--';
    document.getElementById('waveHeight').textContent = '--';
  }
}

// ── INIT ───────────────────────────────────────────────────────────────
fetchPosition();
fetchTrail();
setInterval(fetchPosition, REFRESH_POS);
setInterval(fetchTrail,    REFRESH_POS * 4);
setInterval(() => { if (lastLat) fetchMeteo(lastLat, lastLon); }, REFRESH_MTO);
</script>
</body>
</html>
