<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suivi COBIA 3 — En direct</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{--navy:#0a1628;--accent:#00d4ff;--accent2:#00ff88;--warn:#ffb347;--text:#e8f4fd;--text-dim:#7a9bb5;--panel-bg:rgba(10,22,40,0.88);--border:rgba(0,212,255,0.2);}
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;overflow:hidden;font-family:'Inter',sans-serif;background:var(--navy);color:var(--text);}
  #map{position:absolute;inset:0;z-index:1;}
  #wind-canvas{position:absolute;inset:0;z-index:2;pointer-events:none;}
  .header{position:absolute;top:0;left:0;right:0;z-index:1000;background:linear-gradient(180deg,rgba(10,22,40,0.95) 0%,transparent 100%);padding:14px 18px 50px;display:flex;align-items:center;gap:12px;pointer-events:none;}
  .header-logo{width:40px;height:40px;background:var(--accent);border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 0 20px rgba(0,212,255,0.5);flex-shrink:0;}
  .header-logo svg{width:22px;height:22px;fill:var(--navy);}
  .header-title h1{font-family:'Rajdhani',sans-serif;font-size:22px;font-weight:700;letter-spacing:2px;line-height:1;}
  .header-title p{font-size:10px;color:var(--text-dim);letter-spacing:1px;text-transform:uppercase;margin-top:2px;}
  .header-live{margin-left:auto;display:flex;align-items:center;gap:7px;background:rgba(0,255,136,0.1);border:1px solid rgba(0,255,136,0.3);border-radius:20px;padding:5px 12px;font-size:11px;font-weight:500;color:var(--accent2);letter-spacing:1px;text-transform:uppercase;pointer-events:auto;}
  .live-dot{width:7px;height:7px;background:var(--accent2);border-radius:50%;animation:pulse 1.5s infinite;}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.4;transform:scale(0.8)}}
  .info-panel{position:absolute;bottom:20px;left:16px;z-index:1000;background:var(--panel-bg);border:1px solid var(--border);border-radius:16px;padding:16px;width:255px;backdrop-filter:blur(16px);box-shadow:0 8px 40px rgba(0,0,0,0.6);}
  .section-label{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--text-dim);font-weight:500;margin-bottom:8px;display:flex;align-items:center;gap:6px;}
  .section-label::after{content:'';flex:1;height:1px;background:var(--border);}
  .nav-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:14px;}
  .nav-item{background:rgba(255,255,255,0.04);border-radius:8px;padding:8px 10px;}
  .nav-item .lbl{font-size:9px;color:var(--text-dim);letter-spacing:1px;text-transform:uppercase;margin-bottom:3px;}
  .nav-item .val{font-family:'Rajdhani',sans-serif;font-size:18px;font-weight:600;line-height:1;}
  .nav-item .unt{font-size:9px;color:var(--text-dim);}
  .nav-item.accent .val{color:var(--accent);}
  .meteo-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:12px;}
  .meteo-item{background:rgba(255,255,255,0.04);border-radius:8px;padding:8px 10px;display:flex;gap:7px;align-items:center;}
  .meteo-icon{font-size:18px;flex-shrink:0;}
  .meteo-item .lbl{font-size:9px;color:var(--text-dim);letter-spacing:1px;text-transform:uppercase;margin-bottom:2px;}
  .meteo-item .val{font-family:'Rajdhani',sans-serif;font-size:15px;font-weight:600;color:var(--warn);line-height:1.1;}
  .meteo-item .unt{font-size:9px;color:var(--text-dim);}

  /* BOUTONS COUCHES */
  .layer-btns{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:12px;}
  .layer-btn{border-radius:8px;padding:7px 10px;font-size:10px;font-family:'Inter',sans-serif;letter-spacing:1px;text-transform:uppercase;cursor:pointer;border:1px solid;transition:all 0.2s;display:flex;align-items:center;gap:5px;justify-content:center;font-weight:500;}
  .layer-btn.wind-btn{background:rgba(0,212,255,0.1);border-color:rgba(0,212,255,0.4);color:var(--accent);}
  .layer-btn.wind-btn.off{background:rgba(255,255,255,0.03);border-color:rgba(255,255,255,0.1);color:var(--text-dim);}
  .layer-btn.wave-btn{background:rgba(150,100,255,0.1);border-color:rgba(150,100,255,0.4);color:#b088ff;}
  .layer-btn.wave-btn.off{background:rgba(255,255,255,0.03);border-color:rgba(255,255,255,0.1);color:var(--text-dim);}
  .layer-dot{width:6px;height:6px;border-radius:50%;}
  .wind-btn .layer-dot{background:var(--accent);}
  .wind-btn.off .layer-dot{background:var(--text-dim);}
  .wave-btn .layer-dot{background:#b088ff;}
  .wave-btn.off .layer-dot{background:var(--text-dim);}

  .timestamp{font-size:10px;color:var(--text-dim);text-align:center;padding-top:10px;border-top:1px solid var(--border);}
  .offline-badge{display:none;position:absolute;top:70px;left:50%;transform:translateX(-50%);z-index:1001;background:rgba(255,80,80,0.15);border:1px solid rgba(255,80,80,0.4);color:#ff8080;padding:6px 16px;border-radius:20px;font-size:11px;letter-spacing:1px;white-space:nowrap;}
  .leaflet-control-zoom{border:1px solid var(--border)!important;background:var(--panel-bg)!important;}
  .leaflet-control-zoom a{color:var(--accent)!important;background:transparent!important;border-color:var(--border)!important;}
  .leaflet-control-attribution{background:rgba(10,22,40,0.7)!important;color:var(--text-dim)!important;font-size:9px!important;}
  @media(max-width:480px){
  .info-panel{width:calc(100vw - 24px);left:12px;bottom:12px;padding:11px;}
  .nav-grid{gap:5px;margin-bottom:10px;}
  .nav-item{padding:6px 8px;}
  .nav-item .val{font-size:15px;}
  .nav-item .lbl{font-size:8px;}
  .nav-item .unt{font-size:8px;}
  .meteo-grid{gap:5px;margin-bottom:10px;}
  .meteo-item{padding:6px 8px;gap:5px;}
  .meteo-icon{font-size:15px;}
  .meteo-item .val{font-size:13px;}
  .meteo-item .lbl{font-size:8px;}
  .meteo-item .unt{font-size:8px;}
  .layer-btns{gap:5px;margin-bottom:10px;}
  .layer-btn{padding:5px 8px;font-size:9px;}
  .timestamp{font-size:9px;padding-top:8px;}
  .section-label{font-size:8px;margin-bottom:6px;}
  .header-title h1{font-size:17px;}
  .header-title p{font-size:8px;}
  .header-logo{width:32px;height:32px;}
  .header-logo svg{width:17px;height:17px;}
}
</style>
</head>
<body>
<div class="header">
  <div class="header-logo"><svg viewBox="0 0 24 24"><path d="M3 13.5l1.5-9 4 3 3.5-6 3.5 6 4-3 1.5 9H3zm0 2h18l-1 3H4l-1-3z"/></svg></div>
  <div class="header-title"><h1>COBIA 3</h1><p>Suivi en temps réel — Polynésie française</p></div>
  <div class="header-live"><div class="live-dot"></div>En direct</div>
</div>
<div class="offline-badge" id="offlineBadge">⚠ Signal perdu</div>
<div id="map"></div>
<canvas id="wind-canvas"></canvas>
<div class="info-panel">
  <div class="section-label">Navigation</div>
  <div class="nav-grid">
    <div class="nav-item accent"><div class="lbl">Vitesse</div><div class="val" id="sog">--</div><div class="unt">nœuds</div></div>
    <div class="nav-item"><div class="lbl">Cap</div><div class="val" id="cog">--</div><div class="unt">degrés</div></div>
    <div class="nav-item"><div class="lbl">Latitude</div><div class="val" id="lat" style="font-size:13px">--</div><div class="unt">°S</div></div>
    <div class="nav-item"><div class="lbl">Longitude</div><div class="val" id="lon" style="font-size:13px">--</div><div class="unt">°W</div></div>
  </div>
  <div class="section-label">Météo marine</div>
  <div class="meteo-grid">
    <div class="meteo-item"><div class="meteo-icon">🌬️</div><div><div class="lbl">Vent</div><div class="val" id="windSpeed">--</div><div class="unt" id="windDir">--</div></div></div>
    <div class="meteo-item"><div class="meteo-icon">🌊</div><div><div class="lbl">Houle</div><div class="val" id="waveHeight">--</div><div class="unt" id="wavePeriod">--</div></div></div>
  </div>
  <div class="section-label">Affichage</div>
  <div class="layer-btns">
    <button class="layer-btn wind-btn" id="btnWind" onclick="toggleLayer('wind')">
      <div class="layer-dot"></div> Vent
    </button>
    <button class="layer-btn wave-btn" id="btnWave" onclick="toggleLayer('wave')">
      <div class="layer-dot"></div> Houle
    </button>
  </div>
  <div class="timestamp" id="updated">Connexion en cours…</div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const SUPABASE_URL = 'https://ysdllglxzvgwoooeztlg.supabase.co/rest/v1/position?order=created_at.desc&limit=1';
const SUPABASE_KEY = 'sb_publishable_t3LNsavHm0kvP3Si-nK-0g_QvP2tFH-';
const TRAIL_URL    = 'https://ysdllglxzvgwoooeztlg.supabase.co/rest/v1/position?order=created_at.asc&limit=120';
const DIRS = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSO','SO','OSO','O','ONO','NO','NNO'];
function degToDir(d){return DIRS[Math.round(d/22.5)%16];}

// ── ÉTAT COUCHES ──────────────────────────────────────────────────────
const layers = { wind: true, wave: true };

function toggleLayer(type){
  layers[type] = !layers[type];
  const btn = document.getElementById(type==='wind'?'btnWind':'btnWave');
  btn.classList.toggle('off', !layers[type]);
  resetCanvas();
}

// ── CARTE ─────────────────────────────────────────────────────────────
const map = L.map('map',{zoomControl:true}).setView([-17,-149],7);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{attribution:'© Esri',maxZoom:17}).addTo(map);
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_only_labels/{z}/{x}/{y}{r}.png',{attribution:'© CartoDB',subdomains:'abcd',maxZoom:17,opacity:0.8}).addTo(map);

// ── CANVAS ────────────────────────────────────────────────────────────
const canvas = document.getElementById('wind-canvas');
const ctx    = canvas.getContext('2d');

function resizeCanvas(){canvas.width=window.innerWidth;canvas.height=window.innerHeight;}
resizeCanvas();
window.addEventListener('resize',resizeCanvas);

// ── GRILLES ───────────────────────────────────────────────────────────
let windGrid = null; // vent {u[][], v[][], lats[], lons[]}
let waveGrid = null; // houle {u[][], v[][], lats[], lons[]}

// Particules séparées pour vent et houle
let windParticles = [], waveParticles = [];
const NPART = 1500;
const NPART_WAVE = 800; // moins de particules houle mais plus épaisses

function windColor(spd){ // m/s → noeuds
  const k=spd*1.944;
  if(k<5)  return [220,230,240];  // blanc bleuté — brise légère
  if(k<10) return [200,240,140];  // vert pâle — petite brise
  if(k<15) return [255,240,60];   // jaune vif — brise modérée
  if(k<20) return [255,170,30];   // orange — bonne brise
  if(k<25) return [255,80,30];    // orange-rouge — vent frais
  return [255,30,30];             // rouge vif — fort
}
function waveColor(h){
  // Couleurs froides lumineuses — bien visibles sur fond sombre
  if(h<0.5) return [40,120,255];   // bleu électrique — mer calme
  if(h<1.0) return [0,200,255];    // cyan vif — légère houle
  if(h<1.5) return [0,240,200];    // cyan-turquoise
  if(h<2.0) return [0,230,160];    // turquoise-vert
  if(h<2.5) return [0,210,120];    // vert eau
  if(h<3.5) return [100,240,180];  // vert menthe lumineux
  return [200,255,220];            // blanc verdâtre — forte houle
}

function interp(grid, lat, lon){
  if(!grid) return {u:0,v:0,mag:0};
  const {u,v,lats,lons}=grid;
  const ny=lats.length,nx=lons.length;
  let iy=ny-2,ix=0;
  for(let i=0;i<ny-1;i++) if(lat<=lats[i]&&lat>=lats[i+1]){iy=i;break;}
  for(let i=0;i<nx-1;i++) if(lon>=lons[i]&&lon<=lons[i+1]){ix=i;break;}
  const fy=(lats[iy]-lat)/Math.max(lats[iy]-lats[iy+1],0.001);
  const fx=(lon-lons[ix])/Math.max(lons[ix+1]-lons[ix],0.001);
  const u00=u[iy]?.[ix]||0,u10=u[iy]?.[ix+1]||0,u01=u[iy+1]?.[ix]||0,u11=u[iy+1]?.[ix+1]||0;
  const v00=v[iy]?.[ix]||0,v10=v[iy]?.[ix+1]||0,v01=v[iy+1]?.[ix]||0,v11=v[iy+1]?.[ix+1]||0;
  const ru=u00*(1-fx)*(1-fy)+u10*fx*(1-fy)+u01*(1-fx)*fy+u11*fx*fy;
  const rv=v00*(1-fx)*(1-fy)+v10*fx*(1-fy)+v01*(1-fx)*fy+v11*fx*fy;
  return {u:ru,v:rv,mag:Math.sqrt(ru*ru+rv*rv)};
}

function newParticle(b){
  const dLat=b.getNorth()-b.getSouth(), dLon=b.getEast()-b.getWest();
  const zoom=map.getZoom();
  const maxAge = zoom > 9 ? 25 : zoom > 7 ? 40 : 60;
  return {
    lat:b.getSouth()+Math.random()*dLat,
    lon:b.getWest()+Math.random()*dLon,
    age:Math.floor(Math.random()*maxAge),
    maxAge:maxAge+Math.floor(Math.random()*15)
  };
}

function newWaveParticle(b){
  const zoom=map.getZoom();
  const maxAge = zoom > 9 ? 12 : zoom > 7 ? 18 : 25; // court = traits courts
  return {
    lat:b.getSouth()+Math.random()*(b.getNorth()-b.getSouth()),
    lon:b.getWest()+Math.random()*(b.getEast()-b.getWest()),
    age:Math.floor(Math.random()*maxAge),
    maxAge:maxAge+Math.floor(Math.random()*8)
  };
}
function initParticles(){
  const b=map.getBounds();
  windParticles=Array.from({length:NPART},()=>newParticle(b));
  waveParticles=Array.from({length:800},()=>newWaveParticle(b));
}

let animFrame=null;

function animateWind(){
  const b=map.getBounds();
  const dLat=b.getNorth()-b.getSouth(), dLon=b.getEast()-b.getWest();
  const zoom=map.getZoom();
  const scale=(zoom > 9 ? 0.003 : zoom > 7 ? 0.006 : 0.012)/Math.max(dLat,0.1);

  // Effacement propre — trail court pour éviter le brouillon au zoom
  ctx.globalCompositeOperation='destination-out';
  ctx.fillStyle='rgba(0,0,0,0.12)';
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.globalCompositeOperation='source-over';

  // ── VENT ──
  if(layers.wind && windGrid){
    windParticles.forEach((p,i)=>{
      p.age++;
      if(p.age>p.maxAge||p.lat<b.getSouth()||p.lat>b.getNorth()||p.lon<b.getWest()||p.lon>b.getEast()){
        windParticles[i]=newParticle(b); return;
      }
      const {u,v,mag}=interp(windGrid,p.lat,p.lon);
      if(mag<0.1){p.age=p.maxAge;return;}
      const pt1=map.latLngToContainerPoint([p.lat,p.lon]);
      p.lon+=u*scale; p.lat+=v*scale;
      const pt2=map.latLngToContainerPoint([p.lat,p.lon]);
      const alpha=Math.min(1,p.age/15)*(1-p.age/p.maxAge)*0.75;
      const [r,g,b2]=windColor(mag);
      ctx.beginPath();
      ctx.strokeStyle=`rgba(${r},${g},${b2},${alpha.toFixed(2)})`;
      ctx.lineWidth=1.2;
      ctx.moveTo(pt1.x,pt1.y);ctx.lineTo(pt2.x,pt2.y);ctx.stroke();
    });
  }

  // ── HOULE ──
  if(layers.wave && waveGrid){
    waveParticles.forEach((p,i)=>{
      p.age++;
      if(p.age>p.maxAge||p.lat<b.getSouth()||p.lat>b.getNorth()||p.lon<b.getWest()||p.lon>b.getEast()){
        waveParticles[i]=newWaveParticle(b); return;
      }
      const {u,v,mag}=interp(waveGrid,p.lat,p.lon);
      if(mag<0.05){p.age=p.maxAge;return;}
      const pt1=map.latLngToContainerPoint([p.lat,p.lon]);
      p.lon+=u*scale*0.2; p.lat+=v*scale*0.2;
      const pt2=map.latLngToContainerPoint([p.lat,p.lon]);
      const alpha=Math.min(1,p.age/15)*(1-p.age/p.maxAge)*0.6;
      const [r,g,b2]=waveColor(mag);
      ctx.beginPath();
      ctx.strokeStyle=`rgba(${r},${g},${b2},${alpha.toFixed(2)})`;
      ctx.lineWidth=3.5;
      ctx.lineCap="round";
      ctx.moveTo(pt1.x,pt1.y);ctx.lineTo(pt2.x,pt2.y);ctx.stroke();
    });
  }

  animFrame=requestAnimationFrame(animateWind);
}

function resetCanvas(){
  if(animFrame){cancelAnimationFrame(animFrame);animFrame=null;}
  ctx.clearRect(0,0,canvas.width,canvas.height);
  initParticles();
  animateWind();
}

map.on('movestart zoomstart',()=>{if(animFrame){cancelAnimationFrame(animFrame);animFrame=null;}ctx.clearRect(0,0,canvas.width,canvas.height);});
map.on('moveend zoomend',()=>resetCanvas());

// ── GRILLE VENT ───────────────────────────────────────────────────────
async function fetchWindGrid(clat,clon){
  try{
    const step=1.5,range=9;
    const lats=[],lons=[];
    for(let la=clat+range;la>=clat-range;la-=step) lats.push(parseFloat(la.toFixed(2)));
    for(let lo=clon-range;lo<=clon+range;lo+=step) lons.push(parseFloat(lo.toFixed(2)));
    const rows=await Promise.all(lats.map(lat=>
      Promise.all(lons.map(lon=>
        fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&hourly=wind_speed_10m,wind_direction_10m&wind_speed_unit=ms&forecast_days=1&timezone=GMT&models=best_match`)
        .then(r=>r.json())
      ))
    ));
    const u=[],v=[];
    rows.forEach(row=>{
      const ur=[],vr=[];
      row.forEach(d=>{
        // Prendre l'heure courante dans les données hourly
        const now = new Date();
        const isoH = now.toISOString().slice(0,13);
        const ti = (d.hourly?.time||[]).findIndex(t=>t.startsWith(isoH));
        const i = ti>=0 ? ti : 0;
        const spd=(d.hourly?.wind_speed_10m?.[i])||0;
        const dir=((d.hourly?.wind_direction_10m?.[i])||0)*Math.PI/180;
        ur.push(spd*Math.sin(dir)); vr.push(-spd*Math.cos(dir));
      });
      u.push(ur);v.push(vr);
    });
    windGrid={u,v,lats,lons};
    resetCanvas();
  }catch(e){console.warn('Vent indisponible',e);}
}

// ── GRILLE HOULE ──────────────────────────────────────────────────────
async function fetchWaveGrid(clat,clon){
  try{
    const step=1.5,range=9;
    const lats=[],lons=[];
    for(let la=clat+range;la>=clat-range;la-=step) lats.push(parseFloat(la.toFixed(2)));
    for(let lo=clon-range;lo<=clon+range;lo+=step) lons.push(parseFloat(lo.toFixed(2)));
    const rows=await Promise.all(lats.map(lat=>
      Promise.all(lons.map(lon=>
        fetch(`https://marine-api.open-meteo.com/v1/marine?latitude=${lat}&longitude=${lon}&hourly=wave_height,wave_direction&forecast_days=1&timezone=GMT&models=best_match`)
        .then(r=>r.json())
      ))
    ));
    const u=[],v=[];
    rows.forEach(row=>{
      const ur=[],vr=[];
      row.forEach(d=>{
        const now2 = new Date();
        const isoH2 = now2.toISOString().slice(0,13);
        const ti2 = (d.hourly?.time||[]).findIndex(t=>t.startsWith(isoH2));
        const i2 = ti2>=0 ? ti2 : 0;
        const h=(d.hourly?.wave_height?.[i2])||0;
        const wdir=((d.hourly?.wave_direction?.[i2])||0)*Math.PI/180;
        ur.push(h*Math.sin(wdir)); vr.push(-h*Math.cos(wdir));
      });
      u.push(ur);v.push(vr);
    });
    waveGrid={u,v,lats,lons};
    resetCanvas();
  }catch(e){console.warn('Houle indisponible',e);}
}

// ── ICÔNE NAVIRE ──────────────────────────────────────────────────────
function makeShipIcon(cogDeg){
  const r=cogDeg*Math.PI/180;
  const shape=[[0,-22],[9,2],[7,12],[0,9],[-7,12],[-9,2]];
  const pts=shape.map(([x,y])=>{
    const rx=x*Math.cos(r)-y*Math.sin(r),ry=x*Math.sin(r)+y*Math.cos(r);
    return `${(rx+26).toFixed(1)},${(ry+26).toFixed(1)}`;
  }).join(' ');
  return L.divIcon({
    html:`<svg width="52" height="52" viewBox="0 0 52 52">
      <circle cx="26" cy="26" r="24" fill="rgba(0,212,255,0.08)" stroke="rgba(0,212,255,0.25)" stroke-width="1"/>
      <polygon points="${pts}" fill="rgba(0,0,0,0.3)" transform="translate(1.5,1.5)"/>
      <polygon points="${pts}" fill="#2ecc71" stroke="#1a5e35" stroke-width="1.5" stroke-linejoin="round"/>
      <circle cx="26" cy="26" r="2" fill="white" opacity="0.85"/>
    </svg>`,
    className:'',iconSize:[52,52],iconAnchor:[26,26]
  });
}

let shipMarker=null,trailLine=L.polyline([],{color:'rgba(0,212,255,0.45)',weight:2,dashArray:'6,5'}).addTo(map);
let lastLat=null,lastLon=null;

async function fetchPosition(){
  try{
    const res=await fetch(SUPABASE_URL,{headers:{apikey:SUPABASE_KEY,Authorization:`Bearer ${SUPABASE_KEY}`}});
    const data=await res.json();
    if(!data||!data.length) return;
    const pos=data[0],lat=parseFloat(pos.lat),lon=parseFloat(pos.lon);
    const cog=pos.cog||0,sogKn=((pos.sog||0)/1.852).toFixed(1);
    const icon=makeShipIcon(cog);
    if(!shipMarker){shipMarker=L.marker([lat,lon],{icon,zIndexOffset:2000}).addTo(map);map.setView([lat,lon],8);}
    else{shipMarker.setLatLng([lat,lon]);shipMarker.setIcon(icon);}
    document.getElementById('lat').textContent=Math.abs(lat).toFixed(4);
    document.getElementById('lon').textContent=Math.abs(lon).toFixed(4);
    document.getElementById('sog').textContent=sogKn;
    document.getElementById('cog').textContent=Math.round(cog);
    const d=new Date(pos.ts||pos.created_at);
    const ago=Math.round((Date.now()-d.getTime())/60000);
    document.getElementById('updated').textContent=`Mis à jour ${ago<2?"il y a moins d'1 min":"il y a "+ago+" min"}`;
    document.getElementById('offlineBadge').style.display=ago>10?'block':'none';
    if(lastLat===null||Math.abs(lat-lastLat)>0.5||Math.abs(lon-lastLon)>0.5){
      fetchMeteo(lat,lon);
      fetchWindGrid(lat,lon);
      fetchWaveGrid(lat,lon);
    }
    lastLat=lat;lastLon=lon;
  }catch(e){document.getElementById('offlineBadge').style.display='block';}
}

async function fetchTrail(){
  try{
    const res=await fetch(TRAIL_URL,{headers:{apikey:SUPABASE_KEY,Authorization:`Bearer ${SUPABASE_KEY}`}});
    const data=await res.json();
    if(data&&data.length>1) trailLine.setLatLngs(data.map(p=>[parseFloat(p.lat),parseFloat(p.lon)]));
  }catch(e){}
}

async function fetchMeteo(lat,lon){
  try{
    const [resMarine,resWind]=await Promise.all([
      fetch(`https://marine-api.open-meteo.com/v1/marine?latitude=${lat}&longitude=${lon}&hourly=wave_height,wave_period&forecast_days=1&timezone=auto&models=best_match`),
      fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&hourly=wind_speed_10m,wind_direction_10m&wind_speed_unit=kn&forecast_days=1&timezone=auto&models=best_match`)
    ]);
    const marine=await resMarine.json(),wind=await resWind.json();
    const nowH=new Date();nowH.setMinutes(0,0,0);
    const isoH=nowH.toISOString().slice(0,13);
    const im=marine.hourly.time.findIndex(t=>t.startsWith(isoH));
    const iw=wind.hourly.time.findIndex(t=>t.startsWith(isoH));
    const wh=marine.hourly.wave_height?.[im>=0?im:0],wp=marine.hourly.wave_period?.[im>=0?im:0];
    const ws=wind.hourly.wind_speed_10m?.[iw>=0?iw:0],wd=wind.hourly.wind_direction_10m?.[iw>=0?iw:0];
    if(wh!=null){document.getElementById('waveHeight').textContent=wh.toFixed(1)+' m';document.getElementById('wavePeriod').textContent=wp?`période ${Math.round(wp)}s`:''}
    if(ws!=null){document.getElementById('windSpeed').textContent=Math.round(ws)+' nd';document.getElementById('windDir').textContent=wd!=null?`dir. ${degToDir(wd)}`:''}
  }catch(e){}
}

fetchPosition();fetchTrail();
setInterval(fetchPosition,30000);setInterval(fetchTrail,120000);
setInterval(()=>{if(lastLat){fetchMeteo(lastLat,lastLon);fetchWindGrid(lastLat,lastLon);fetchWaveGrid(lastLat,lastLon);}},3600000);
</script>
