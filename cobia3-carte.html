<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suivi COBIA 3 — En direct</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0a1628;
    --accent: #00d4ff;
    --accent2: #00ff88;
    --warn: #ffb347;
    --text: #e8f4fd;
    --text-dim: #7a9bb5;
    --panel-bg: rgba(10,22,40,0.88);
    --border: rgba(0,212,255,0.2);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; overflow:hidden; font-family:'Inter',sans-serif; background:var(--navy); color:var(--text); }
  #windy { position:absolute; inset:0; z-index:1; }

  .header {
    position:absolute; top:0; left:0; right:0; z-index:1000;
    background:linear-gradient(180deg,rgba(10,22,40,0.95) 0%,transparent 100%);
    padding:14px 18px 50px;
    display:flex; align-items:center; gap:12px;
    pointer-events:none;
  }
  .header-logo {
    width:40px; height:40px; background:var(--accent); border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 0 20px rgba(0,212,255,0.5); flex-shrink:0;
  }
  .header-logo svg { width:22px; height:22px; fill:var(--navy); }
  .header-title h1 { font-family:'Rajdhani',sans-serif; font-size:22px; font-weight:700; letter-spacing:2px; line-height:1; }
  .header-title p { font-size:10px; color:var(--text-dim); letter-spacing:1px; text-transform:uppercase; margin-top:2px; }
  .header-live {
    margin-left:auto;
    display:flex; align-items:center; gap:7px;
    background:rgba(0,255,136,0.1); border:1px solid rgba(0,255,136,0.3);
    border-radius:20px; padding:5px 12px;
    font-size:11px; font-weight:500; color:var(--accent2);
    letter-spacing:1px; text-transform:uppercase;
    pointer-events:auto;
  }
  .live-dot { width:7px; height:7px; background:var(--accent2); border-radius:50%; animation:pulse 1.5s infinite; }
  @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.4;transform:scale(0.8)} }

  .info-panel {
    position:absolute; bottom:20px; left:16px; z-index:1000;
    background:var(--panel-bg); border:1px solid var(--border);
    border-radius:16px; padding:16px; width:255px;
    backdrop-filter:blur(16px);
    box-shadow:0 8px 40px rgba(0,0,0,0.6);
  }
  .section-label {
    font-size:9px; letter-spacing:2px; text-transform:uppercase;
    color:var(--text-dim); font-weight:500; margin-bottom:8px;
    display:flex; align-items:center; gap:6px;
  }
  .section-label::after { content:''; flex:1; height:1px; background:var(--border); }
  .nav-grid { display:grid; grid-template-columns:1fr 1fr; gap:7px; margin-bottom:14px; }
  .nav-item { background:rgba(255,255,255,0.04); border-radius:8px; padding:8px 10px; }
  .nav-item .lbl { font-size:9px; color:var(--text-dim); letter-spacing:1px; text-transform:uppercase; margin-bottom:3px; }
  .nav-item .val { font-family:'Rajdhani',sans-serif; font-size:18px; font-weight:600; line-height:1; }
  .nav-item .unt { font-size:9px; color:var(--text-dim); }
  .nav-item.accent .val { color:var(--accent); }
  .meteo-grid { display:grid; grid-template-columns:1fr 1fr; gap:7px; margin-bottom:14px; }
  .meteo-item { background:rgba(255,255,255,0.04); border-radius:8px; padding:8px 10px; display:flex; gap:7px; align-items:center; }
  .meteo-icon { font-size:18px; flex-shrink:0; }
  .meteo-item .lbl { font-size:9px; color:var(--text-dim); letter-spacing:1px; text-transform:uppercase; margin-bottom:2px; }
  .meteo-item .val { font-family:'Rajdhani',sans-serif; font-size:15px; font-weight:600; color:var(--warn); line-height:1.1; }
  .meteo-item .unt { font-size:9px; color:var(--text-dim); }
  .timestamp { font-size:10px; color:var(--text-dim); text-align:center; padding-top:10px; border-top:1px solid var(--border); }
  .offline-badge {
    display:none; position:absolute; top:70px; left:50%; transform:translateX(-50%);
    z-index:1001; background:rgba(255,80,80,0.15); border:1px solid rgba(255,80,80,0.4);
    color:#ff8080; padding:6px 16px; border-radius:20px; font-size:11px; letter-spacing:1px; white-space:nowrap;
  }
  @media(max-width:480px){ .info-panel{ width:calc(100vw - 32px); } }
</style>
</head>
<body>

<div class="header">
  <div class="header-logo">
    <svg viewBox="0 0 24 24"><path d="M3 13.5l1.5-9 4 3 3.5-6 3.5 6 4-3 1.5 9H3zm0 2h18l-1 3H4l-1-3z"/></svg>
  </div>
  <div class="header-title">
    <h1>COBIA 3</h1>
    <p>Suivi en temps réel — Polynésie française</p>
  </div>
  <div class="header-live"><div class="live-dot"></div>En direct</div>
</div>

<div class="offline-badge" id="offlineBadge">⚠ Signal perdu</div>
<div id="windy"></div>

<div class="info-panel">
  <div class="section-label">Navigation</div>
  <div class="nav-grid">
    <div class="nav-item accent">
      <div class="lbl">Vitesse</div>
      <div class="val" id="sog">--</div>
      <div class="unt">nœuds</div>
    </div>
    <div class="nav-item">
      <div class="lbl">Cap</div>
      <div class="val" id="cog">--</div>
      <div class="unt">degrés</div>
    </div>
    <div class="nav-item">
      <div class="lbl">Latitude</div>
      <div class="val" id="lat" style="font-size:13px">--</div>
      <div class="unt">°S</div>
    </div>
    <div class="nav-item">
      <div class="lbl">Longitude</div>
      <div class="val" id="lon" style="font-size:13px">--</div>
      <div class="unt">°W</div>
    </div>
  </div>
  <div class="section-label">Météo marine</div>
  <div class="meteo-grid">
    <div class="meteo-item">
      <div class="meteo-icon">🌬️</div>
      <div>
        <div class="lbl">Vent</div>
        <div class="val" id="windSpeed">--</div>
        <div class="unt" id="windDir">--</div>
      </div>
    </div>
    <div class="meteo-item">
      <div class="meteo-icon">🌊</div>
      <div>
        <div class="lbl">Houle</div>
        <div class="val" id="waveHeight">--</div>
        <div class="unt" id="wavePeriod">--</div>
      </div>
    </div>
  </div>
  <div class="timestamp" id="updated">Connexion en cours…</div>
</div>

<!-- Windy Map Forecast API — donne accès à Leaflet complet -->
<script src="https://api.windy.com/assets/map-forecast/libBoot.js"></script>
<script>
const SUPABASE_URL = 'https://ysdllglxzvgwoooeztlg.supabase.co/rest/v1/position?order=created_at.desc&limit=1';
const SUPABASE_KEY = 'sb_publishable_t3LNsavHm0kvP3Si-nK-0g_QvP2tFH-';
const TRAIL_URL    = 'https://ysdllglxzvgwoooeztlg.supabase.co/rest/v1/position?order=created_at.asc&limit=120';
const WINDY_KEY    = 'stX7vhRZfZSGt4ulMVeB6bfHuoAGLbHf';

const DIRS = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSO','SO','OSO','O','ONO','NO','NNO'];
function degToDir(d) { return DIRS[Math.round(d/22.5)%16]; }

// ── ICÔNE NAVIRE STYLE MARINETRAFFIC ───────────────────────────────────
function makeShipIcon(L, cogDeg) {
  const r = cogDeg * Math.PI / 180;
  const shape = [
    [0, -22], [9, 2], [7, 12], [0, 9], [-7, 12], [-9, 2]
  ];
  const pts = shape.map(([x, y]) => {
    const rx = x * Math.cos(r) - y * Math.sin(r);
    const ry = x * Math.sin(r) + y * Math.cos(r);
    return `${(rx+26).toFixed(1)},${(ry+26).toFixed(1)}`;
  }).join(' ');
  return L.divIcon({
    html: `<svg width="52" height="52" viewBox="0 0 52 52">
      <circle cx="26" cy="26" r="24" fill="rgba(0,212,255,0.08)" stroke="rgba(0,212,255,0.3)" stroke-width="1"/>
      <polygon points="${pts}" fill="rgba(0,0,0,0.3)" transform="translate(1.5,1.5)"/>
      <polygon points="${pts}" fill="#2ecc71" stroke="#1a5e35" stroke-width="1.5" stroke-linejoin="round"/>
      <circle cx="26" cy="26" r="2" fill="white" opacity="0.85"/>
    </svg>`,
    className:'', iconSize:[52,52], iconAnchor:[26,26]
  });
}

let shipMarker = null;
let trailLine  = null;
let windyMap   = null;
let L          = null;
let lastLat = null, lastLon = null;

// ── INIT WINDY API ─────────────────────────────────────────────────────
windyInit({
  key: WINDY_KEY,
  verbose: false,
  lat: -17,
  lon: -149,
  zoom: 7,
  overlay: 'waves',
}, windyAPI => {
  windyMap = windyAPI.map;
  L = window.L;

  // Trace de route sur la carte Windy/Leaflet
  trailLine = L.polyline([], {
    color: 'rgba(0,212,255,0.5)',
    weight: 2,
    dashArray: '6,5'
  }).addTo(windyMap);

  // Démarrer le suivi position
  fetchPosition();
  fetchTrail();
  setInterval(fetchPosition, 30000);
  setInterval(fetchTrail, 120000);
});

// ── POSITION ───────────────────────────────────────────────────────────
async function fetchPosition() {
  try {
    const res  = await fetch(SUPABASE_URL, {
      headers:{ apikey:SUPABASE_KEY, Authorization:`Bearer ${SUPABASE_KEY}` }
    });
    const data = await res.json();
    if (!data || !data.length || !windyMap) return;

    const pos   = data[0];
    const lat   = parseFloat(pos.lat);
    const lon   = parseFloat(pos.lon);
    const cog   = pos.cog || 0;
    const sogKn = ((pos.sog || 0) / 1.852).toFixed(1);

    // Icône navire sur la carte Windy
    const icon = makeShipIcon(L, cog);
    if (!shipMarker) {
      shipMarker = L.marker([lat, lon], { icon, zIndexOffset:1000 }).addTo(windyMap);
      windyMap.setView([lat, lon], 8);
    } else {
      shipMarker.setLatLng([lat, lon]);
      shipMarker.setIcon(icon);
    }

    // Panneau navigation
    document.getElementById('lat').textContent = Math.abs(lat).toFixed(4);
    document.getElementById('lon').textContent = Math.abs(lon).toFixed(4);
    document.getElementById('sog').textContent = sogKn;
    document.getElementById('cog').textContent = Math.round(cog);

    const d   = new Date(pos.ts || pos.created_at);
    const ago = Math.round((Date.now() - d.getTime()) / 60000);
    document.getElementById('updated').textContent =
      `Mis à jour ${ago < 2 ? "il y a moins d'1 min" : "il y a " + ago + " min"}`;
    document.getElementById('offlineBadge').style.display = ago > 10 ? 'block' : 'none';

    if (lastLat === null || Math.abs(lat-lastLat) > 0.1 || Math.abs(lon-lastLon) > 0.1) {
      fetchMeteo(lat, lon);
    }
    lastLat = lat; lastLon = lon;
  } catch(e) {
    document.getElementById('offlineBadge').style.display = 'block';
  }
}

// ── TRACE ──────────────────────────────────────────────────────────────
async function fetchTrail() {
  try {
    const res  = await fetch(TRAIL_URL, {
      headers:{ apikey:SUPABASE_KEY, Authorization:`Bearer ${SUPABASE_KEY}` }
    });
    const data = await res.json();
    if (data && data.length > 1 && trailLine)
      trailLine.setLatLngs(data.map(p => [parseFloat(p.lat), parseFloat(p.lon)]));
  } catch(e) {}
}

// ── MÉTÉO PANNEAU ──────────────────────────────────────────────────────
async function fetchMeteo(lat, lon) {
  try {
    const [resMarine, resWind] = await Promise.all([
      fetch(`https://marine-api.open-meteo.com/v1/marine?latitude=${lat}&longitude=${lon}&hourly=wave_height,wave_period&forecast_days=1&timezone=auto`),
      fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&hourly=wind_speed_10m,wind_direction_10m&wind_speed_unit=kn&forecast_days=1&timezone=auto`)
    ]);
    const marine = await resMarine.json();
    const wind   = await resWind.json();
    const nowH = new Date(); nowH.setMinutes(0,0,0);
    const isoH = nowH.toISOString().slice(0,13);
    const im = marine.hourly.time.findIndex(t => t.startsWith(isoH));
    const iw = wind.hourly.time.findIndex(t => t.startsWith(isoH));
    const wh = marine.hourly.wave_height?.[im >= 0 ? im : 0];
    const wp = marine.hourly.wave_period?.[im >= 0 ? im : 0];
    const ws = wind.hourly.wind_speed_10m?.[iw >= 0 ? iw : 0];
    const wd = wind.hourly.wind_direction_10m?.[iw >= 0 ? iw : 0];
    if (wh != null) {
      document.getElementById('waveHeight').textContent = wh.toFixed(1) + ' m';
      document.getElementById('wavePeriod').textContent = wp ? `période ${Math.round(wp)}s` : '';
    }
    if (ws != null) {
      document.getElementById('windSpeed').textContent = Math.round(ws) + ' nd';
      document.getElementById('windDir').textContent   = wd != null ? `dir. ${degToDir(wd)}` : '';
    }
  } catch(e) {}
}
</script>
</body>
</html>
