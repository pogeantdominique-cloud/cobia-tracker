<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Cobia 3 — Position en direct</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0A3D62">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Cobia 3">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Nunito', sans-serif;
      background: #1a9fd4;
      height: 100vh;
      overflow: hidden;
    }

    #map {
      width: 100%;
      height: 100vh;
    }

    /* Style carte façon Apple Maps / TravelBoast */
    .leaflet-container {
      background: #48c4f0;
      font-family: 'Nunito', sans-serif;
    }

    /* Header flottant */
    #header {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      background: rgba(255,255,255,0.95);
      border-radius: 50px;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
      white-space: nowrap;
    }

    .header-ship {
      font-size: 20px;
    }

    .header-title {
      font-size: 15px;
      font-weight: 800;
      color: #1a1a2e;
      letter-spacing: 0.5px;
    }

    .header-live {
      display: flex;
      align-items: center;
      gap: 5px;
      background: #ff3b30;
      color: white;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1px;
      padding: 3px 8px;
      border-radius: 20px;
    }

    .live-dot {
      width: 5px;
      height: 5px;
      background: white;
      border-radius: 50%;
      animation: blink 1.2s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.2; }
    }

    /* Badge distance style TravelBoast */
    .distance-badge {
      background: #ff3b30;
      color: white;
      font-family: 'Nunito', sans-serif;
      font-size: 13px;
      font-weight: 800;
      padding: 6px 14px;
      border-radius: 20px;
      box-shadow: 0 3px 12px rgba(255,59,48,0.4);
      white-space: nowrap;
      pointer-events: none;
    }

    /* Panel infos bas */
    #info-panel {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      background: rgba(255,255,255,0.95);
      border-radius: 20px;
      padding: 16px 24px;
      display: flex;
      gap: 24px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.15);
      backdrop-filter: blur(10px);
    }

    .info-item {
      text-align: center;
    }

    .info-label {
      font-size: 10px;
      font-weight: 700;
      color: #999;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 3px;
    }

    .info-value {
      font-size: 18px;
      font-weight: 900;
      color: #1a1a2e;
    }

    .info-unit {
      font-size: 10px;
      font-weight: 600;
      color: #999;
      margin-left: 2px;
    }

    .info-divider {
      width: 1px;
      background: rgba(0,0,0,0.08);
      align-self: stretch;
    }

    /* Marker bateau custom */
    .ship-wrap {
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.4));
      transform-origin: center;
    }

    /* Port marker */
    .port-dot {
      width: 12px;
      height: 12px;
      background: #ff3b30;
      border: 3px solid white;
      border-radius: 50%;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }

    /* Leaflet overrides pour style lumineux */
    .leaflet-tile-pane {
      filter: saturate(1.3) brightness(1.05);
    }

    .leaflet-control-zoom {
      border: none !important;
      box-shadow: 0 2px 12px rgba(0,0,0,0.15) !important;
    }

    .leaflet-control-zoom a {
      font-family: 'Nunito', sans-serif !important;
      font-weight: 800 !important;
      color: #333 !important;
      border-radius: 8px !important;
    }

    @media (max-width: 500px) {
      #info-panel { gap: 14px; padding: 12px 18px; }
      .info-value { font-size: 15px; }
      #header { padding: 8px 14px; gap: 8px; }
      .header-title { font-size: 13px; }
    }
  </style>
</head>
<body>

<div id="header">
  <span class="header-ship">🚢</span>
  <span class="header-title">COBIA 3</span>
  <div class="header-live">
    <div class="live-dot"></div>
    DIRECT
  </div>
</div>

<div id="map"></div>

<div id="info-panel">
  <div class="info-item">
    <div class="info-label">Latitude</div>
    <div class="info-value" style="font-size:13px"><span id="lat">—</span></div>
  </div>
  <div class="info-divider"></div>
  <div class="info-item">
    <div class="info-label">Longitude</div>
    <div class="info-value" style="font-size:13px"><span id="lon">—</span></div>
  </div>
  <div class="info-divider"></div>
  <div class="info-item">
    <div class="info-label">Vitesse</div>
    <div class="info-value"><span id="sog">—</span><span class="info-unit">kn</span></div>
  </div>
  <div class="info-divider"></div>
  <div class="info-item">
    <div class="info-label">Cap</div>
    <div class="info-value"><span id="cog">—</span><span class="info-unit">°</span></div>
  </div>
  <div class="info-divider"></div>
  <div class="info-item">
    <div class="info-label">Destination</div>
    <div class="info-value" style="font-size:13px" id="destination">—</div>
  </div>
  <div class="info-divider"></div>
  <div class="info-item">
    <div class="info-label">Distance</div>
    <div class="info-value"><span id="dist-wpt">—</span><span class="info-unit">nm</span></div>
  </div>
  <div class="info-divider"></div>
  <div class="info-item">
    <div class="info-label">ETA</div>
    <div class="info-value" style="font-size:13px" id="eta">—</div>
  </div>
  <div class="info-divider"></div>
  <div class="info-item">
    <div class="info-label">Mis à jour</div>
    <div class="info-value" style="font-size:13px" id="updated">—</div>
  </div>
</div>

<script>
  const SUPABASE_URL = 'https://ysdllglxzvgwoooeztlg.supabase.co/rest/v1/position';
  const SUPABASE_WPT = 'https://ysdllglxzvgwoooeztlg.supabase.co/rest/v1/waypoint';
  const SUPABASE_KEY = 'sb_publishable_t3LNsavHm0kvP3Si-nK-0g_QvP2tFH-';

  // Papeete coords
  const PAPEETE = [-17.5359, -149.5667];

  // Carte style lumineux
  const map = L.map('map', {
    center: [-17.8, -149.8],
    zoom: 9,
    zoomControl: true,
    attributionControl: false
  });

  // Tuiles satellite Esri (style Google Earth)
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    maxZoom: 19
  }).addTo(map);
  // Labels par dessus
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', {
    maxZoom: 19,
    opacity: 0.9
  }).addTo(map);

  // Marker Papeete
  const portIcon = L.divIcon({
    className: '',
    html: '<div class="port-dot"></div>',
    iconSize: [12, 12],
    iconAnchor: [6, 6]
  });
  const portMarker = L.marker(PAPEETE, { icon: portIcon }).addTo(map);
  portMarker.bindTooltip('Papeete', {
    permanent: true,
    direction: 'right',
    className: 'port-label',
    offset: [8, 0]
  }).openTooltip();

  // Icône triangle style MarineTraffic
  function shipSVG(angle) {
    return `
      <div style="transform: rotate(${angle}deg); width:20px; height:30px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4));">
        <svg width="20" height="30" viewBox="0 0 20 30" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M10 1 L19 28 L10 23 L1 28 Z" fill="#1a9e3f" stroke="white" stroke-width="1.2" stroke-linejoin="round"/>
        </svg>
      </div>
    `;
  }

  let shipMarker = null;
  let headingLine = null;
  let trailLine = L.polyline([], {
    color: 'white',
    weight: 2,
    opacity: 0.7,
    dashArray: '6,10'
  }).addTo(map);

  // Calcul point devant le bateau (cap + distance en degrés)
  function destPoint(lat, lon, cogDeg, distNM) {
    const R = 3440.065;
    const d = distNM / R;
    const brng = cogDeg * Math.PI / 180;
    const lat1 = lat * Math.PI / 180;
    const lon1 = lon * Math.PI / 180;
    const lat2 = Math.asin(Math.sin(lat1)*Math.cos(d) + Math.cos(lat1)*Math.sin(d)*Math.cos(brng));
    const lon2 = lon1 + Math.atan2(Math.sin(brng)*Math.sin(d)*Math.cos(lat1), Math.cos(d)-Math.sin(lat1)*Math.sin(lat2));
    return [lat2 * 180/Math.PI, lon2 * 180/Math.PI];
  }

  async function fetchPosition() {
    try {
      const res = await fetch(`${SUPABASE_URL}?order=created_at.desc&limit=1`, {
        headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
      });
      const data = await res.json();
      if (!data || data.length === 0) return;

      const pos = data[0];
      const latlng = [pos.lat, pos.lon];
      const cogDeg = pos.cog || 0;
      const sogKn = pos.sog ? pos.sog / 1.852 : 0;

      // Ship marker
      const icon = L.divIcon({
        className: '',
        html: shipSVG(cogDeg),
        iconSize: [20, 30],
        iconAnchor: [10, 15]
      });

      if (!shipMarker) {
        shipMarker = L.marker(latlng, { icon, zIndexOffset: 1000 }).addTo(map);
        map.setView(latlng, 10);
      } else {
        shipMarker.setLatLng(latlng);
        shipMarker.setIcon(icon);
      }

      // Vecteur cap = 30 minutes de navigation à la vitesse actuelle
      if (headingLine) map.removeLayer(headingLine);
      if (sogKn > 0.2) {
        const distIn30min = sogKn * 0.5; // 30min = 0.5h
        const ahead = destPoint(pos.lat, pos.lon, cogDeg, distIn30min);
        headingLine = L.polyline([latlng, ahead], {
          color: 'white',
          weight: 2,
          opacity: 0.9,
          dashArray: '4,6'
        }).addTo(map);
      }

      // Panel infos
      document.getElementById('lat').textContent = pos.lat.toFixed(4) + '°';
      document.getElementById('lon').textContent = pos.lon.toFixed(4) + '°';
      document.getElementById('sog').textContent = sogKn.toFixed(1);
      document.getElementById('cog').textContent = Math.round(cogDeg);

      const d = new Date(pos.ts || pos.created_at);
      document.getElementById('updated').textContent = d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });

    } catch(e) {
      console.error(e);
    }
  }

  async function fetchTrail() {
    try {
      // Récupérer les 2 dernières heures (240 points à 30s = ~2h)
      const twoHoursAgo = new Date(Date.now() - 2*60*60*1000).toISOString();
      const res = await fetch(
        `${SUPABASE_URL}?order=created_at.asc&created_at=gte.${twoHoursAgo}`,
        { headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` } }
      );
      const data = await res.json();
      if (data && data.length > 1) {
        trailLine.setLatLngs(data.map(p => [p.lat, p.lon]));
      }
    } catch(e) {}
  }

  // Style tooltip port
  const style = document.createElement('style');
  style.textContent = `
    .port-label {
      background: white !important;
      border: none !important;
      border-radius: 8px !important;
      padding: 3px 8px !important;
      font-family: 'Nunito', sans-serif !important;
      font-weight: 800 !important;
      font-size: 12px !important;
      color: #1a1a2e !important;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15) !important;
    }
    .port-label::before { display: none !important; }
    .wpt-label {
      background: #ff9500 !important;
      border: none !important;
      border-radius: 8px !important;
      padding: 3px 10px !important;
      font-family: 'Nunito', sans-serif !important;
      font-weight: 800 !important;
      font-size: 12px !important;
      color: white !important;
      box-shadow: 0 2px 8px rgba(255,149,0,0.4) !important;
    }
    .wpt-label::before { display: none !important; }
  `;
  document.head.appendChild(style);

  let wptMarker = null;
  let wptLine = null;

  async function fetchWaypoint() {
    try {
      const res = await fetch(`${SUPABASE_WPT}?order=created_at.desc&limit=1`, {
        headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
      });
      const data = await res.json();
      if (!data || data.length === 0) return;

      const wpt = data[0];
      if (!wpt.lat || !wpt.lon) return;

      const wptLatlng = [wpt.lat, wpt.lon];

      // Marqueur destination
      const wptIcon = L.divIcon({
        className: '',
        html: '<div style="width:14px;height:14px;background:#ff9500;border:3px solid white;border-radius:50%;box-shadow:0 2px 8px rgba(255,149,0,0.5);"></div>',
        iconSize: [14, 14],
        iconAnchor: [7, 7]
      });

      if (!wptMarker) {
        wptMarker = L.marker(wptLatlng, { icon: wptIcon }).addTo(map);
      } else {
        wptMarker.setLatLng(wptLatlng);
      }

      // Nom destination
      wptMarker.bindTooltip(wpt.nom || 'Destination', {
        permanent: true,
        direction: 'right',
        className: 'wpt-label',
        offset: [8, 0]
      }).openTooltip();

      // Ligne bateau → destination
      if (shipMarker) {
        if (wptLine) map.removeLayer(wptLine);
        wptLine = L.polyline([shipMarker.getLatLng(), wptLatlng], {
          color: '#ff9500',
          weight: 1.5,
          opacity: 0.6,
          dashArray: '8,12'
        }).addTo(map);
      }

      // Panel infos
      document.getElementById('destination').textContent = wpt.nom || 'Waypoint';
      document.getElementById('dist-wpt').textContent = wpt.distance_nm ? Math.round(wpt.distance_nm) : '—';

      if (wpt.eta) {
        const eta = new Date(wpt.eta);
        document.getElementById('eta').textContent =
          eta.toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit' }) + ' ' +
          eta.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
      } else {
        document.getElementById('eta').textContent = 'Vitesse insuffisante';
      }

    } catch(e) {
      console.error('Waypoint error:', e);
    }
  }

  fetchTrail();
  fetchPosition();
  fetchWaypoint();
  setInterval(fetchPosition, 30000);
  setInterval(fetchWaypoint, 60000);
</script>
</body>
</html>
